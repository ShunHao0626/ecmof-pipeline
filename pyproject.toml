[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmof-pipeline"
version = "0.1.0"
description = "Extract, normalize, and validate electrically conductive MOF data."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "ShunHao0626" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
pdf = [
  "pdfplumber>=0.10",
  "pymupdf4llm>=0.0.17",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
ecmof-pipeline = "ecmof_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
